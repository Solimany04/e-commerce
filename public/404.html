<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Redirect all 404 requests to index.html
        var redirectTo = '/';
        var path = window.location.pathname.replace(redirectTo, '/');
        window.location.replace(redirectTo + '#' + path);
      </script>
</body>
</html>
